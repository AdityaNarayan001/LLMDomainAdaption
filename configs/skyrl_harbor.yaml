# SkyRL RL via Harbor — config draft (modeled on SkyRL/examples/train_integrations/harbor).
# SkyRL's agentic-RL path runs each task as a Harbor "trial": SkyRL injects task.path,
# agent.model_name, agent.kwargs.api_base (its served vLLM endpoint), and a session_id;
# Harbor runs the chosen agent against the task and reports the reward.
#
# STATUS: integration draft (M3). Two pieces still required to run end-to-end:
#   1. hyperswitch tasks -> Harbor task format (task.path per RL task in rl_tasks.jsonl),
#      with the verifier = our cargo nextest / compile+similarity (reward.py) as the grader.
#   2. agent choice: a Harbor built-in (swe-agent / terminus-2 / openhands) OR a custom
#      Harbor agent wrapping our Pi tools. (Harbor's built-ins do NOT include Pi.)
# Until (1)+(2) are wired + validated on a live SkyRL run, the flywheel halts at RL.

harbor_trial_config:
  trials_dir: ~/trials
  timeout_multiplier: 1.0
  agent:
    name: swe-agent              # candidate built-in; or custom Pi-wrapping agent (TODO)
    override_timeout_sec: 1200
    kwargs:
      max_turns: 40
      collect_rollout_details: true   # required for step-wise / token-faithful training
      temperature: 1.0
      model_info: { max_input_tokens: 32768, max_output_tokens: 32768,
                    input_cost_per_token: 0.0, output_cost_per_token: 0.0 }

# SkyRL trainer side (maps from our configs/rl.yaml):
trainer:
  algorithm: dapo
  group_size: 8
  lr: 3.0e-6
  kl_coef: 0.0                    # KL-free DAPO
generator:
  inference_engine: { base_url: "http://localhost:8000", max_model_len: 32768 }
  sampling: { n: 8, temperature: 1.0, max_tokens: 16384 }
data:
  tasks: "data/datasets/rl_tasks.jsonl"   # -> converted to Harbor tasks (TODO)
