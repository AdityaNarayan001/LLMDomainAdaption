# Data pipeline config — Stage 1. Source = juspay/hyperswitch.
source:
  repo: "juspay/hyperswitch"
  clone_url: "https://github.com/juspay/hyperswitch.git"
  default_branch: "main"
  # Pin a base commit so the warm build cache serves many tasks (Risk R6).
  base_commit: null            # filled in at M1 after the supply census picks a base
  raw_repo: "data/hyperswitch" # local checkout (used by ingest_repos / build_cpt / build_rl)
  out_dir: "data/datasets"

cpt:
  # Phase 1 Foundation: source + docs + openapi. Phase 2 Evolution: commit diffs.
  # Phase 3 PR Mastery: PRs + reviews + issues.
  include_globs: ["crates/**/*.rs", "docs/**/*.md", "api-reference/**/*.yml", "**/README.md"]
  exclude_globs: ["target/**", "**/*_generated.rs", "tests/fixtures/**"]
  dependency_ordered: true     # topological order from Cargo.toml workspace deps
  file_marker: "// File: {path}\n"
  fim_rate: 0.5                # PSM+SPM
  chunk_overlap_tokens: 2048   # DOC-ONLY: no chunking is implemented — whole files are single
                               # samples (trainer truncates at sequence_len); wire or accept
  dedup_jaccard: 0.70          # MinHash/LSH near-dedup
  rust_upsample: 1.0           # DOC-ONLY: upsampling not implemented
  general_replay_frac: 0.08    # DOC-ONLY: replay mixing not implemented (anti-forgetting is
                               # currently the curriculum carry-over only)
  heldout_frac: 0.15           # split BY crate/file; decontaminate vs HS-bench

github:
  # gh CLI / REST. Used by both Stage 1 (RL tasks) and Stage 0b (eval set).
  per_page: 100
  # DOC-ONLY below: ingest_github hardcodes state=closed; build_rl filters on test_files —
  # these keys are not read by code (kept as design intent):
  states: ["closed"]
  require_linked_pr: true
  require_tests_changed: true
